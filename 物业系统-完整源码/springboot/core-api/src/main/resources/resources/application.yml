redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  #password: yourRedisPassword  # 如果有密码
  timeout: 60000
server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 35MB
      enabled: true
tomcat:
  max-swallow-size: 200MB
# 配置mybatis实体和xml映射
mybatis:
  ## 映射xml
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 配置日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
wechat:
  appid: ${WECHAT_APPID:wx0000000000000000} # 微信小程序 AppId
  secret: ${WECHAT_SECRET:00000000000000000000000000000000} # 微信小程序 AppSecret
jwt:
  secret: ${JWT_SECRET:property-system-jwt-secret-key-2024} # JWT 签名密钥
  expire: 86400000   # 1 天

# 文件上传配置
file:
  upload-path: ${FILE_UPLOAD_PATH:${user.dir}/files}
  access-url: http://localhost:8080/files/download  # 文件访问URL前缀
logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB
